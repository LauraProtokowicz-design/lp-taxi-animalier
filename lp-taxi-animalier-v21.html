<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LP Taxi Animalier">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>LP Taxi Animalier</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#f4efe4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(900px 450px at 50% -10%,rgba(212,175,55,.13),transparent 65%),#050505}
.header{position:sticky;top:0;z-index:20;background:rgba(5,5,5,.96);backdrop-filter:blur(12px);border-bottom:1px solid #25211c;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;gap:13px;padding:20px 16px 14px}.logo{width:50px;height:50px;border:1.5px solid #d4af37;border-radius:50%;display:grid;place-items:center;background:#0d0a06;box-shadow:0 0 20px rgba(212,175,55,.15)}
.lp{font-family:Georgia,serif;font-weight:800;color:#d4af37;letter-spacing:1px}.brand-title{font-family:Georgia,serif;font-size:21px;font-weight:700}.brand-title em{color:#d4af37;font-style:normal}.sub{font-size:9px;letter-spacing:1.8px;color:#9c9589;margin-top:3px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:0 12px 11px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid #28231d;background:#0b0b0b;color:#aaa195;border-radius:999px;padding:9px 13px}.tab.active{color:#171008;border-color:#d4af37;background:linear-gradient(115deg,#856719,#d4af37 28%,#fff1b9 50%,#d4af37 72%,#856719);font-weight:700}
.main{max-width:1100px;margin:auto;padding:24px 14px calc(70px + env(safe-area-inset-bottom,0px));min-height:calc(100vh - env(safe-area-inset-top,0px));}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.h2,h1,h2,h3{font-family:Georgia,serif;margin:0}.h2{font-size:28px}.divider{display:flex;align-items:center;gap:9px;margin:12px 0 18px;color:#6e571e}.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(212,175,55,.35))}
.card{background:linear-gradient(165deg,#171415,#0e0c0d);border:1px solid #29241f;border-radius:16px;padding:17px;margin-top:13px;box-shadow:0 5px 24px rgba(0,0,0,.3)}.grid{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{text-align:center}.label{color:#9b9387;font-size:11px;letter-spacing:1px;text-transform:uppercase}.value{font-family:Georgia,serif;font-size:23px;color:#f1d980;font-weight:700;margin-top:6px}
.btn{border:1px solid #d4af37;border-radius:999px;padding:10px 14px;color:#171008;background:linear-gradient(115deg,#856719,#d4af37 28%,#fff1b9 50%,#d4af37 72%,#856719);font-weight:650}.btn.ghost{background:transparent;color:#f0d87e;border-color:#5a4920}.btn.danger{background:transparent;color:#d47a6d;border-color:#4b2924}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:#9b9387;font-size:13px}.rdv-done{opacity:.62}.rdv-done b,.rdv-done .muted{text-decoration:line-through}.rdv-done .pill{text-decoration:none}.item{padding:14px 0;border-top:1px solid #29241f}.item:first-child{border-top:0}.empty{text-align:center;color:#948c80;padding:55px 10px}.pill{display:inline-block;border:1px solid #9b7a22;color:#f0d87e;border-radius:999px;padding:3px 8px;font-size:10px;letter-spacing:1px;text-transform:uppercase}.price{font-family:Georgia,serif;color:#f1d980;font-weight:700;font-size:18px}
label{display:flex;flex-direction:column;gap:6px;color:#aaa195;font-size:12px;text-transform:uppercase;letter-spacing:.35px}input,select,textarea{width:100%;background:#0a0908;color:#f4efe4;border:1px solid #2a251f;border-radius:9px;padding:10px 11px;font-size:14px;text-transform:none;letter-spacing:0}input:focus,select:focus,textarea:focus{outline:1px solid #d4af37;border-color:#d4af37}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.86);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px))}.modalbox{max-width:760px;margin:15px auto;background:#121011;border:1px solid #3a3020;border-radius:16px;padding:18px;box-shadow:0 20px 70px #000}.modalbox.light{background:#faf7f0;color:#18130e;border:0}.modalbox.light .muted{color:#6d665d}
.docline{display:flex;justify-content:space-between;border-top:1px solid #e0d9c8;padding:8px 0}.toast{position:fixed;z-index:200;bottom:22px;left:50%;transform:translateX(-50%);background:#d4af37;color:#171008;padding:10px 16px;border-radius:999px;font-weight:700}
.animal-photo{width:76px;height:76px;border-radius:14px;object-fit:cover;border:1px solid #d4af37;background:#0a0908}.animal-photo-empty{width:76px;height:76px;border-radius:14px;border:1px dashed #5a4920;display:grid;place-items:center;color:#8f7b4a;font-size:11px;text-align:center}.searchbox{margin:12px 0}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick .btn{width:100%}.notice{padding:12px 14px;border:1px solid #5a4920;border-radius:12px;color:#dbc878;background:rgba(212,175,55,.05);font-size:13px;margin-top:13px}
@media(max-width:700px){.grid2,.stats{grid-template-columns:1fr}.brand-title{font-size:20px}.main{padding-top:20px}}
@media print{.header,.tabs,.actions,.modal .btn{display:none!important}.modal{position:static;background:white;padding:0}.modalbox.light{box-shadow:none;border-radius:0;max-width:none}}

.print-sheet{display:none}
@media print{
 body{background:#fff!important;color:#111!important}
 .app{display:none!important}
 .print-sheet{display:block!important;background:#fff!important;color:#111!important;padding:18mm;font-family:Arial,sans-serif}
 .print-sheet h1{font-family:Georgia,serif;font-size:24pt;margin:0 0 3mm}
 .print-sheet .meta{font-size:10pt;color:#555;margin-bottom:8mm}
 .print-sheet .dochead{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #111;padding-bottom:5mm}
 .print-sheet .line{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:3mm 0}
 .print-sheet .total{font-weight:800;font-size:15pt;border-top:2px solid #111;border-bottom:0}
 .print-sheet .signature{margin-top:10mm}
}
.animal-preview{width:78px;flex:0 0 78px}.animal-photo{width:78px;height:78px;object-fit:cover;border-radius:14px;border:1px solid #5a4920;background:#0a0908}.animal-photo-empty{width:78px;height:78px;border:1px dashed #5a4920;border-radius:14px;display:grid;place-items:center;text-align:center;color:#bda65c;font-size:11px}.searchbox{margin:10px 0}.searchbox input{padding:13px 14px}.quick{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.signature-pad{background:#fff;touch-action:none;width:100%;height:150px;background:#080706;border:1px solid #5d4a1d;border-radius:12px;touch-action:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
const KEY="lp-taxi-animalier-data-v2";
const defaults={
 geoapifyKey:"",
 tarifs:{priseEnCharge:20,km10_100:.90,km100_300:.80,attenteVet:15,animalSupp:10,majorationPct:25,visiteDomicile:15,visiteSupp:10,gardeNuit:35,depl0_10:5,depl11_20:10,depl21_30:15,deplKmSupp:.50,seuilLongueDuree:7,remiseLongueDureePct:10},
 clients:[],rdvs:[],demandes:[],devis:[],factures:[]
};
let data=load(), tab="agenda", modal=null, toastTimer=null, routeResult=null, routeBusy=false;

function load(){try{return Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||"{}"),{tarifs:Object.assign({},defaults.tarifs,(JSON.parse(localStorage.getItem(KEY)||"{}").tarifs||{}))})}catch(e){return structured(defaults)}}
function structured(x){return JSON.parse(JSON.stringify(x))}
function persist(){
 try{localStorage.setItem(KEY,JSON.stringify(data));return true}
 catch(err){console.warn("Stockage local indisponible",err);return false}
}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function today(){return new Date().toISOString().slice(0,10)}
function eur(n){return Number(n||0).toFixed(2).replace(".",",")+" €"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function client(id){return data.clients.find(c=>c.id===id)}
function setTab(t){const y=window.scrollY||window.pageYOffset||0;tab=t;modal=null;render();requestAnimationFrame(()=>window.scrollTo({top:y,behavior:"instant"}))}

function enableSwipeNavigation(){
 if(window.__lpSwipeBound)return;
 window.__lpSwipeBound=true;
 let sx=null,sy=null,st=0,locked=false,lastSwipe=0;
 const tabs=["agenda","agendafull","demandes","clients","devis","factures","ca","itineraire","tarifs"];
 const main=document.getElementById("app");
 if(!main)return;
 main.addEventListener("touchstart",e=>{
   if(e.touches.length!==1)return;
   const el=e.target;
   if(el.closest("input,textarea,select,button,a,[contenteditable=\"true\"],.modal,.tabs"))return;
   sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=Date.now(); locked=false;
 },{passive:true});
 main.addEventListener("touchmove",e=>{
   if(sx===null||e.touches.length!==1)return;
   const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
   if(Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)*1.2)locked=true;
 },{passive:true});
 main.addEventListener("touchend",e=>{
   if(sx===null)return;
   const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy,dt=Date.now()-st;
   sx=sy=null;
   if(!locked || dt>900 || Math.abs(dx)<90 || Math.abs(dx)<Math.abs(dy)*1.25 || Date.now()-lastSwipe<450)return;
   const i=tabs.indexOf(tab); if(i<0)return;
   const next=i+(dx<0?1:-1);
   if(next>=0&&next<tabs.length){ lastSwipe=Date.now(); setTab(tabs[next]); }
 },{passive:true});
}

function notify(s){clearTimeout(toastTimer);const d=document.createElement("div");d.className="toast";d.textContent=s;document.body.appendChild(d);toastTimer=setTimeout(()=>d.remove(),1800)}
function savePatch(p){data=Object.assign({},data,p);persist();render()}
function btn(text,action,kind=""){return `<button type="button" class="btn ${kind}" data-action="${action}">${text}</button>`}

function transportCalc(v){
 const t=data.tarifs, km=+v.km||0, lines=[["Prise en charge",t.priseEnCharge]];
 if(km>10) lines.push([`Distance 10–100 km`,(Math.min(km,100)-10)*t.km10_100]);
 if(km>100) lines.push([`Distance 100–300 km`,(Math.min(km,300)-100)*t.km100_300]);
 if(+v.animauxSupp>0) lines.push([`Animaux supplémentaires (${v.animauxSupp})`,+v.animauxSupp*t.animalSupp]);
 if(+v.attenteH>0) lines.push([`Attente vétérinaire (${v.attenteH} h)`,+v.attenteH*t.attenteVet]);
 if(+v.peages>0) lines.push(["Péages",+v.peages]);
 let total=lines.reduce((a,x)=>a+x[1],0);
 if(v.majoration){let m=total*t.majorationPct/100;lines.push([`Majoration (+${t.majorationPct}%)`,m]);total+=m}
 return {lines,total}
}
function gardeCalc(v){
 const t=data.tarifs, lines=[];
 if(+v.visites>0)lines.push([`Visites à domicile (${v.visites})`,+v.visites*t.visiteDomicile]);
 if(+v.visitesSupp>0)lines.push([`Visites supplémentaires (${v.visitesSupp})`,+v.visitesSupp*t.visiteSupp]);
 if(+v.nuits>0)lines.push([`Gardes de nuit (${v.nuits})`,+v.nuits*t.gardeNuit]);
 const k=+v.kmDepl||0;
 if(k){let f=k<=10?t.depl0_10:k<=20?t.depl11_20:k<=30?t.depl21_30:t.depl21_30+(k-30)*t.deplKmSupp;lines.push([`Frais de déplacement (${k} km)`,f])}
 let total=lines.reduce((a,x)=>a+x[1],0);
 if(+v.jours>=t.seuilLongueDuree&&total){let r=total*t.remiseLongueDureePct/100;lines.push([`Remise longue durée (-${t.remiseLongueDureePct}%)`,-r]);total-=r}
 return {lines,total}
}
function calc(v){return v.service==="Transport"?transportCalc(v):gardeCalc(v)}

function header(){
 const tabs=[["agenda","Accueil"],["agendafull","Agenda"],["demandes","Demandes"],["clients","Clients"],["devis","Devis"],["factures","Factures"],["ca","Chiffre d'affaires"],["itineraire","Itinéraire"],["tarifs","Tarifs"]];
 return `<header class="header"><div class="brand"><div class="logo"><span class="lp">LP</span></div><div><div class="brand-title">LP <em>Taxi</em> Animalier</div><div class="sub">GESTION D'ACTIVITÉ · SAINT-ÉTIENNE</div></div></div><nav class="tabs">${tabs.map(x=>`<button class="tab ${tab===x[0]?"active":""}" data-tab="${x[0]}">${x[1]}${x[0]==="demandes"&&data.demandes.length?" ("+data.demandes.length+")":""}</button>`).join("")}</nav></header>`
}
function page(title,actionLabel,action){return `<div class="topline"><h2 class="h2">${title}</h2>${actionLabel?btn(actionLabel,action):""}</div><div class="divider">🐾</div>`}
function empty(t){return `<div class="empty">${t}</div>`}

function agenda(){
 const rows=[...data.rdvs].sort((a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure));
 const todayRows=rows.filter(r=>r.date===today());
 const unpaid=data.factures.filter(f=>f.statutPaiement!=="payee").reduce((s,f)=>s+Number(f.total||0),0);
 const month=data.factures.filter(f=>f.statutPaiement==="payee"&&String(f.date).slice(0,7)===today().slice(0,7)).reduce((s,f)=>s+Number(f.total||0),0);
 return page("Tableau de bord")+`<div class="stats"><div class="card stat"><div class="label">Aujourd'hui</div><div class="value">${todayRows.length}</div></div><div class="card stat"><div class="label">Clients</div><div class="value">${data.clients.length}</div></div><div class="card stat"><div class="label">À encaisser</div><div class="value">${eur(unpaid)}</div></div></div><div class="quick"><button class="btn" data-action="new-rdv">＋ Rendez-vous</button><button class="btn" data-action="new-client">＋ Client</button><button class="btn" data-action="new-devis">＋ Devis</button></div><div class="card"><div class="row"><h3>Rendez-vous à venir</h3>${btn("Voir l'agenda","go-agenda","ghost")}</div>${rows.slice(0,5).map(r=>{const c=client(r.clientId)||{},a=(c.animaux||[]).find(x=>x.id===r.animalId);return `<div class="item"><b>${esc(r.date)} · ${esc(r.heure)}</b><div class="muted">${esc(c.nom||r.nom||"Client")} · ${esc(r.service)}${a?` · 🐾 ${esc(a.nom)}`:""}</div><div class="muted">${esc(r.adresse||"")}${r.destination?" → "+esc(r.destination):""}</div></div>`}).join("")||empty("Aucun rendez-vous.")}</div><div class="card"><h3>Ce mois-ci</h3><div class="value">${eur(month)}</div><div class="muted">Factures encaissées</div></div>`}
function agendaFull(){
 let rows=[...data.rdvs].sort((a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure));
 return page("Agenda","＋ Nouveau rendez-vous","new-rdv")+`<div class="card">${rows.length?rows.map(r=>{const c=client(r.clientId)||{},a=(c.animaux||[]).find(x=>x.id===r.animalId),done=!!r.termine;return `<div class="item ${done?"rdv-done":""}"><div class="row"><div><b>${esc(r.date)} · ${esc(r.heure)}</b><div class="muted">${esc(c.nom||r.nom||"Client")} · ${esc(r.service)}</div>${a?`<div class="muted">🐾 ${esc(a.nom||"Sans nom")} · ${esc(a.espece||"")}${a.race?" · "+esc(a.race):""}</div>`:""}<div class="muted">${esc(r.adresse||"")}${r.destination?" → "+esc(r.destination):""}</div>${Number(r.montant||0)>0?`<div class="muted">Montant : <b>${eur(r.montant)}</b></div>`:""}</div><div class="actions">${done?`<span class="pill">✓ Terminé</span>`:""}${btn(done?"☐ Rouvrir":"☑ Terminé","toggle-rdv-"+r.id,"ghost")}${btn("Modifier","edit-rdv-"+r.id,"ghost")}${btn("Supprimer","del-rdv-"+r.id,"danger ghost")}</div></div></div>`}).join(""):empty("Aucun rendez-vous pour le moment.")}</div>`}
function demandes(){
 return page("Demandes clients","＋ Nouvelle demande","new-dem")+`<div class="notice">Les demandes peuvent venir du téléphone, SMS, email ou réseaux sociaux. « Accepter » crée automatiquement le client et le rendez-vous.</div><div class="card">${data.demandes.length?data.demandes.map(d=>`<div class="item"><div class="row"><div><b>${esc(d.nom)}</b><div class="muted">${esc(d.service)} · ${esc(d.date)} à ${esc(d.heure)} · ${esc(d.telephone)}</div><div class="muted">${esc(d.notes||"")}</div></div><div class="actions">${btn("✓ Accepter","accept-"+d.id)}${btn("✕","del-dem-"+d.id,"danger ghost")}</div></div></div>`).join(""):empty("Aucune demande en attente.")}</div>`
}
function clientHistory(id){
 const rdv=data.rdvs.filter(r=>r.clientId===id).sort((a,b)=>(b.date+b.heure).localeCompare(a.date+a.heure));
 const docs=[...data.devis.map(x=>({...x,_type:"devis"})),...data.factures.map(x=>({...x,_type:"facture"}))].filter(x=>x.clientId===id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 return {rdv,docs};
}
function clients(){
 return page("Fiches clients","＋ Nouveau client","new-client")+`<div class="searchbox"><input id="client-search" placeholder="🔎 Rechercher un client ou un animal…"></div><div class="grid grid2" id="client-list">${data.clients.length?data.clients.map(c=>{const h=clientHistory(c.id);return `<div class="card client-card" data-search="${esc((c.nom||"")+" "+(c.telephone||"")+" "+(c.email||"")+" "+(c.animaux||[]).map(a=>a.nom).join(" "))}"><div class="row"><h3>${esc(c.nom)}</h3>${btn("Supprimer","del-client-"+c.id,"danger ghost")}</div><div class="muted">${esc(c.telephone||"")}</div><div class="muted">${esc(c.email||"")}</div><div class="muted">${esc(c.adresse||"")}</div>${(c.animaux||[]).map(a=>`<div class="item"><div class="row"><div style="display:flex;align-items:center;min-width:0">${a.photo?`<img class="animal-photo" src="${a.photo}" alt="${esc(a.nom||"Animal")}">`:`<div class="animal-photo-empty">🐾</div>`}<div style="margin-left:10px"><b>${esc(a.nom||"Sans nom")}</b><div class="muted">${esc(a.espece||"")}${a.race?" · "+esc(a.race):""}${a.poids?" · "+esc(a.poids)+" kg":""}</div>${a.notes?`<div class="muted">${esc(a.notes)}</div>`:""}</div></div></div></div>`).join("")}<div class="notice">${h.rdv.length} rendez-vous · ${h.docs.length} document(s)</div><div class="actions">${btn("Modifier","edit-client-"+c.id,"ghost")}${c.telephone?`<a class="btn ghost" href="tel:${esc(c.telephone)}">📞 Appeler</a>`:""}${c.email?`<a class="btn ghost" href="mailto:${esc(c.email)}">✉️ Email</a>`:""}</div></div>`}).join(""):empty("Aucun client enregistré.")}</div>`
}
function docs(type){
 const arr=data[type], label=type==="devis"?"Devis":"Factures";
 return page(label,"＋ Nouveau "+label.toLowerCase(),"new-"+type)+`<div class="card">${arr.length?[...arr].reverse().map(d=>`<div class="item"><div class="row"><div><span class="pill">${label}</span> <b>${esc(d.numero)}</b><div class="muted">${esc(client(d.clientId)?.nom||"Client")} · ${esc(d.description)}</div></div><div class="price">${eur(d.total)}</div></div><div class="actions">${btn("Aperçu","preview-"+type+"-"+d.id,"ghost")}${type==="devis"?btn("→ Facture","convert-facture-"+d.id,"ghost"):""}${type==="factures"?btn(d.statutPaiement==="payee"?"Marquer non payée":"Marquer payée","toggle-pay-"+d.id,"ghost"):""}${btn("Supprimer","del-"+type+"-"+d.id,"danger ghost")}</div></div>`).join(""):empty("Aucun "+label.toLowerCase()+".")}</div>`
}
function ca(){
 const paid=data.factures.filter(f=>f.statutPaiement==="payee");
 const done=data.rdvs.filter(r=>r.termine&&Number(r.montant||0)>0);
 const invoiceTotal=paid.reduce((s,f)=>s+Number(f.total||0),0);
 const rdvTotal=done.reduce((s,r)=>s+Number(r.montant||0),0);
 const total=invoiceTotal+rdvTotal;
 const monthKey=today().slice(0,7);
 const month=paid.filter(f=>String(f.date).slice(0,7)===monthKey).reduce((s,f)=>s+Number(f.total||0),0)
   +done.filter(r=>String(r.date).slice(0,7)===monthKey).reduce((s,r)=>s+Number(r.montant||0),0);
 const pending=data.factures.filter(f=>f.statutPaiement!=="payee").reduce((s,f)=>s+Number(f.total||0),0);
 return page("Chiffre d'affaires")+`
 <div class="stats">
  <div class="card stat"><div class="label">CA total</div><div class="value">${eur(total)}</div></div>
  <div class="card stat"><div class="label">Ce mois-ci</div><div class="value">${eur(month)}</div></div>
  <div class="card stat"><div class="label">Factures en attente</div><div class="value">${eur(pending)}</div></div>
 </div>
 <div class="card"><h3>Origine du CA</h3>
  <div class="item row"><span>Factures encaissées</span><b>${eur(invoiceTotal)}</b></div>
  <div class="item row"><span>Rendez-vous terminés</span><b>${eur(rdvTotal)}</b></div>

function itineraire(){

function formatDuration(sec){sec=Number(sec)||0;const h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);return h?`${h} h ${m.toString().padStart(2,"0")}`:`${m} min`}
function routePrice(distance,v){const t=data.tarifs,km=Number(distance)||0,lines=[["Prise en charge",t.priseEnCharge]];if(km>10)lines.push(["Distance 10–100 km",(Math.min(km,100)-10)*t.km10_100]);if(km>100)lines.push(["Distance 100–300 km",(Math.min(km,300)-100)*t.km100_300]);if(km>300)lines.push(["Distance au-delà de 300 km",(km-300)*t.km100_300]);if(Number(v.animauxSupp)>0)lines.push([`Animaux supplémentaires (${v.animauxSupp})`,Number(v.animauxSupp)*t.animalSupp]);if(Number(v.attenteH)>0)lines.push([`Attente vétérinaire (${v.attenteH} h)`,Number(v.attenteH)*t.attenteVet]);let total=lines.reduce((a,x)=>a+x[1],0);if(v.majoration){const m=total*t.majorationPct/100;lines.push([`Majoration (+${t.majorationPct}%)`,m]);total+=m}return{lines,total}}
async function geocodeAddress(q,key){const u=`https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(q)}&format=json&limit=1&apiKey=${encodeURIComponent(key)}`;try{const r=await fetch(u);const text=await r.text();let j={};try{j=JSON.parse(text)}catch{}if(!r.ok){const detail=j.error||j.message||text||`HTTP ${r.status}`;throw new Error(`Geoapify géocodage : ${r.status} — ${detail}`)}if(!j.results||!j.results.length)throw new Error(`Adresse introuvable : ${q}`);const x=j.results[0];return{lat:Number(x.lat??x.geometry?.coordinates?.[1]),lon:Number(x.lon??x.geometry?.coordinates?.[0]),label:x.formatted||q}}catch(err){if(err instanceof TypeError)throw new Error("Geoapify : requête bloquée (réseau/CORS/origine)");throw err}}
async function calculateRoute(e){e.preventDefault();const f=e.currentTarget,key=data.geoapifyKey;if(!key){notify("Ajoute d'abord ta clé Geoapify");return}const fd=formDataObj(f);if(!fd.depart||!fd.arrivee){notify("Renseigne les deux adresses");return}routeBusy=true;render();try{const [a,b]=await Promise.all([geocodeAddress(fd.depart,key),geocodeAddress(fd.arrivee,key)]);if(!Number.isFinite(a.lat)||!Number.isFinite(a.lon)||!Number.isFinite(b.lat)||!Number.isFinite(b.lon))throw new Error("Coordonnées d'adresse invalides.");const u=`https://api.geoapify.com/v1/routing?waypoints=${a.lat},${a.lon}|${b.lat},${b.lon}&mode=drive&units=metric&format=json&apiKey=${encodeURIComponent(key)}`;const r=await fetch(u);const text=await r.text();let j={};try{j=JSON.parse(text)}catch{}if(!r.ok){const detail=j.error||j.message||text||`HTTP ${r.status}`;throw new Error(`Geoapify itinéraire : ${r.status} — ${detail}`)}const route=j.results?.[0]||j.features?.[0]?.properties||j.properties||{};let rawDistance=Number(route.distance),rawTime=Number(route.time);if((!Number.isFinite(rawDistance)||rawDistance<=0||!Number.isFinite(rawTime)||rawTime<=0)&&Array.isArray(route.legs)){rawDistance=route.legs.reduce((sum,x)=>sum+Number(x.distance||0),0);rawTime=route.legs.reduce((sum,x)=>sum+Number(x.time||0),0)}if(!Number.isFinite(rawDistance)||rawDistance<=0||!Number.isFinite(rawTime)||rawTime<=0)throw new Error("Geoapify n'a pas renvoyé de distance/temps pour cet itinéraire.");const distance=rawDistance/1000*(fd.allerRetour?2:1);const duration=rawTime*(fd.allerRetour?2:1);const priced=routePrice(distance,{animauxSupp:Number(fd.animauxSupp||0),attenteH:Number(fd.attenteH||0),majoration:!!fd.majoration});routeResult={clientId:fd.clientId||"",animalId:fd.animalId||"",depart:fd.depart,arrivee:fd.arrivee,allerRetour:!!fd.allerRetour,animauxSupp:Number(fd.animauxSupp||0),attenteH:Number(fd.attenteH||0),majoration:!!fd.majoration,peages:0,distance,duration,lines:priced.lines,total:priced.total};notify("Itinéraire calculé ✓")}catch(err){console.error(err);notify(err.message||"Impossible de calculer l'itinéraire")}finally{routeBusy=false;render()}}

    sexe:block.querySelector('[name="animal_sexe"]')?.value||'',
    veterinaire:block.querySelector('[name="animal_veto"]')?.value||'',
    notes:block.querySelector('[name="animal_notes"]')?.value||'',
    photo
   });
  }
  const get=n=>form.querySelector(`[name="${n}"]`)?.value||'';
  const c={id:old?.id||uid(),nom:get('nom').trim(),telephone:get('telephone').trim(),email:get('email').trim(),adresse:get('adresse').trim(),animaux};
  if(!c.nom){notify('Le nom du client est obligatoire');return}
  const nextClients=old?previous.map(x=>x.id===old.id?c:x):[...previous,c];
  data.clients=nextClients;
  if(!persist()){
   // Si le stockage est plein à cause d’une ancienne photo, réessayer sans les nouvelles photos.
   const safeClients=structured(nextClients).map((cl,ci)=>{
    const prev=nextClients[ci];
    return {...cl,animaux:(cl.animaux||[]).map((an,ai)=>{
      const prevAn=prev.animaux?.[ai]||{};
      return {...an,photo:prevAn.photo||''};
    })};
   });
   data.clients=safeClients;
   if(!persist()){
    data.clients=previous;
    notify('Impossible d’enregistrer : le stockage de l’iPhone est indisponible ou plein.');
    return;
   }
   notify('Informations enregistrées ✓ (photo non enregistrée, stockage insuffisant)');
  }
  modal=null;
  notify('Client enregistré ✓');
  try{ render(); }
  catch(renderErr){
   console.error('Affichage après enregistrement',renderErr);
   // Les données sont déjà enregistrées : on ferme proprement le formulaire sans afficher une fausse erreur photo.
   document.querySelector('.modal')?.remove();
  }
 }catch(err){
  data.clients=previous;
  console.error('Enregistrement client',err);
  notify('Impossible d’enregistrer ce client. Vérifie les informations saisies.');
 }
}

function resizePhoto(file,max=420,quality=.52){
 return new Promise((resolve,reject)=>{
  if(!file){resolve("");return}
  const draw=(img,cleanup)=>{
   try{
    const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
    if(!iw||!ih)throw new Error("dimensions");
    const scale=Math.min(1,max/Math.max(iw,ih));
    const w=Math.max(1,Math.round(iw*scale)), h=Math.max(1,Math.round(ih*scale));
    const canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext("2d"); if(!ctx)throw new Error("canvas");
    ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    const out=canvas.toDataURL("image/jpeg",quality);
    if(!out||out.length<100)throw new Error("empty");
    cleanup?.(); resolve(out);
   }catch(err){cleanup?.();reject(err)}
  };
  if(window.createImageBitmap){
   createImageBitmap(file).then(bitmap=>draw(bitmap,()=>bitmap.close?.())).catch(()=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>draw(img,()=>URL.revokeObjectURL(url));
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("format"))};
    img.src=url;
   });
  }else{
   const url=URL.createObjectURL(file),img=new Image();
   img.onload=()=>draw(img,()=>URL.revokeObjectURL(url));
   img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("format"))};
   img.src=url;
  }
 });
}

function canvasSignature(){
 const canvas=document.getElementById("signature-pad"); if(!canvas)return;
 const ctx=canvas.getContext("2d"); ctx.lineWidth=4;ctx.lineCap="round";ctx.strokeStyle="#111";ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
 let drawing=false;
 const pos=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}};
 canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};
 canvas.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};
 canvas.onpointerup=()=>drawing=false;canvas.onpointercancel=()=>drawing=false;
 if(modal.data.signature){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,canvas.width,canvas.height);im.src=modal.data.signature}
}

 const url=copy.toDataURL("image/jpeg",.82);
 modal.data.signature=url;

function pdfFromDoc(d,type){
 const c=client(d.clientId)||{};
 const lines=[
  type==="devis"?"DEVIS":"FACTURE",d.numero,"LP Taxi Animalier",
  "Saint-Etienne (42) - 07 62 08 28 07 - LPtaxianimalier@outlook.fr",
  "Client : "+(c.nom||"Client"),"Adresse : "+(c.adresse||""),
  "Telephone : "+(c.telephone||""),"Email : "+(c.email||""),d.description,
  ...d.lignes.map(x=>x[0]+" : "+eur(x[1])),
  "TOTAL : "+eur(d.total),
  d.signature?"Signature electronique : signee":""
 ].filter(Boolean);
 const escPdf=t=>String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
 let stream="BT /F1 11 Tf 50 790 Td ";
 lines.forEach((l,i)=>{if(i)stream+="0 -18 Td ";stream+="("+escPdf(l)+") Tj ";});
 stream+="ET";
 const objs=[
  "<< /Type /Catalog /Pages 2 0 R >>",
  "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
  "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>",
  "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
  `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`
 ];
 let pdf="%PDF-1.4\n",offs=[0];
 objs.forEach((o,i)=>{offs.push(pdf.length);pdf+=(i+1)+" 0 obj\n"+o+"\nendobj\n"});
 const x=pdf.length;
 pdf+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n";
 for(let i=1;i<offs.length;i++)pdf+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
 pdf+="trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+x+"\n%%EOF";
 return new TextEncoder().encode(pdf);
}
